<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cynthiagrey Designs | Where Christmas Comes to Life</title>

<meta name="description" content="Cynthiagrey Designs — Christmas lights, Christmas trees and beautiful festive decorations.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#061912;
  color:#f7f1e3;
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

.snow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  opacity:.35;
  background-image:
    radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 75% 30%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 45% 75%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 90% 80%,#fff 0 1px,transparent 2px);
  background-size:180px 180px,240px 240px,210px 210px,300px 300px;
  animation:snow 18s linear infinite;
}

@keyframes snow{
  to{
    background-position:
      30px 180px,
      -30px 240px,
      20px 210px,
      -20px 300px;
  }
}

/* HEADER */

.site-header{
  height:82px;
  padding:0 5vw;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:30;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.brand-mark{
  width:42px;
  height:42px;
  border:1px solid #d7b66a;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#d7b66a;
  font-family:"Cormorant Garamond",serif;
  font-size:17px;
}

.brand strong{
  display:block;
  letter-spacing:3px;
  font-size:12px;
}

.brand small{
  display:block;
  color:#d7b66a;
  letter-spacing:4px;
  font-size:8px;
  margin-top:3px;
}

.nav{
  display:flex;
  align-items:center;
  gap:30px;
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.nav a{
  opacity:.85;
  transition:.3s;
}

.nav a:hover{
  color:#e1c47d;
}

.nav-cta{
  padding:12px 18px;
  border:1px solid #d7b66a;
  color:#e5ca86!important;
}

.menu-toggle{
  display:none;
  background:none;
  border:0;
  color:#fff;
  font-size:26px;
}

/* HERO */

.hero{
  min-height:100vh;
  display:grid;
  place-items:center;
  position:relative;

  background:
    linear-gradient(
      90deg,
      rgba(3,18,12,.96),
      rgba(3,18,12,.70),
      rgba(3,18,12,.20)
    ),
    url("https://images.unsplash.com/photo-1512389142860-9c449e58a543?auto=format&fit=crop&w=2200&q=90")
    center/cover;
}

.hero:after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:30%;
  background:linear-gradient(transparent,#061912);
}

.hero-content{
  width:min(1100px,90%);
  position:relative;
  z-index:2;
  padding-top:90px;
}

.eyebrow,
.section-kicker{
  font-size:10px;
  letter-spacing:4px;
  color:#d7b66a;
  font-weight:700;
}

.hero h1{
  font-family:"Cormorant Garamond",serif;
  font-weight:600;
  font-size:clamp(65px,9vw,128px);
  line-height:.83;
  margin:24px 0 30px;
  letter-spacing:-4px;
}

.hero h1 em,
h2 em{
  font-style:italic;
  color:#d9bb72;
  font-weight:500;
}

.hero-copy{
  max-width:570px;
  font-size:17px;
  line-height:1.8;
  color:#d7ded9;
}

.hero-actions{
  display:flex;
  gap:14px;
  margin-top:34px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:20px;
  padding:16px 23px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:700;
  transition:.3s;
}

.btn-gold{
  background:#d7b66a;
  color:#061912;
}

.btn-gold:hover{
  background:#f0d18b;
  transform:translateY(-2px);
}

.btn-ghost{
  border:1px solid rgba(255,255,255,.4);
}

.btn-ghost:hover{
  border-color:#d7b66a;
  color:#d7b66a;
}

.hero-scroll{
  position:absolute;
  bottom:32px;
  left:5vw;
  font-size:9px;
  letter-spacing:3px;
  color:#9ba69f;
  z-index:3;
}

/* SECTIONS */

.section{
  padding:120px 7vw;
}

.intro{
  background:#061912;
}

.intro-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10vw;
  margin:25px 0 70px;
}

.intro h2,
.section-heading h2,
.story h2,
.process h2{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(50px,6vw,82px);
  font-weight:500;
  line-height:.9;
  margin:0;
  letter-spacing:-2px;
}

.intro-grid>p,
.section-heading>p{
  font-size:15px;
  line-height:1.9;
  color:#aeb9b2;
  max-width:510px;
  align-self:end;
}

/* COLLECTION */

.collection-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:18px;
}

.collection-card{
  height:520px;
  position:relative;
  overflow:hidden;
  background:#102d22;
}

.collection-card.tall{
  height:600px;
}

.collection-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .8s;
}

.collection-card:hover img{
  transform:scale(1.06);
}

.card-overlay{
  position:absolute;
  inset:auto 0 0;
  padding:28px;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
  min-height:190px;
}

.card-overlay span{
  color:#d7b66a;
  font-size:10px;
  letter-spacing:3px;
}

.card-overlay h3{
  font-family:"Cormorant Garamond",serif;
  font-size:34px;
  margin:9px 0 5px;
}

.card-overlay p{
  font-size:12px;
  color:#d0d7d2;
  line-height:1.5;
}

/* STATEMENT */

.statement{
  padding:150px 7vw;
  text-align:center;
  background:
    linear-gradient(rgba(101,10,22,.78),rgba(101,10,22,.78)),
    url("https://images.unsplash.com/photo-1576919228236-a097c32a5cd4?auto=format&fit=crop&w=1800&q=85")
    center/cover;
  position:relative;
}

.statement-inner{
  position:relative;
  z-index:1;
}

.statement span{
  font-size:10px;
  letter-spacing:5px;
}

.statement h2{
  font-family:"Cormorant Garamond",serif;
  font-size:clamp(60px,8vw,110px);
  line-height:.85;
  margin:25px 0;
  font-weight:500;
}

.statement h2 em{
  color:#f4d58e;
}

.statement p{
  max-width:500px;
  margin:auto;
  line-height:1.8;
  color:#f7e7d2;
}

/* GALLERY */

.section-heading{
  display:flex;
  justify-content:space-between;
  gap:40px;
  align-items:end;
  margin-bottom:55px;
}

.gallery-grid{
  display:grid;
  grid-template-columns:1.3fr .8fr .8fr;
  grid-template-rows:250px 300px;
  gap:16px;
}

.gallery-grid img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.g1{
  grid-row:span 2;
}

.g4{
  grid-column:2 / 4;
}

/* STORY */

.story{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8vw;
  align-items:center;
  background:#f3eddf;
  color:#11251d;
}

.story-image{
  height:650px;
  position:relative;
}

.story-image>img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.image
